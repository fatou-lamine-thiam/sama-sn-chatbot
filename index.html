<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAMA.SN – Assistant</title>
<link rel="icon" type="image/jpeg" href="logo.jpeg">
<style>
:root{
  --green:#0b6b3a; --green-d:#084d2a; --yellow:#f5b800; --red:#d62718;
  --bg:#f4f6f3; --surface:#ffffff; --text:#1c2a22; --muted:#5d6b63; --line:#dde4de;
  --bot:#ffffff; --user:#0b6b3a; --user-text:#ffffff;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1712; --surface:#16211a; --text:#e8efe9; --muted:#9bab9f; --line:#27382d; --bot:#1d2b22; --user:#0f8a4b;}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center}
.app{width:100%;max-width:640px;height:100%;height:100dvh;display:flex;flex-direction:column;background:var(--surface)}
header{background:var(--green);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:4px solid var(--yellow);flex:none}
.logo{height:54px;width:auto;border-radius:10px;background:#fff;padding:5px 7px;flex:none;display:block}
header h1{font-size:18px;margin:0;line-height:1.2}
header p{margin:0;font-size:12px;opacity:.85}
.lang{margin-left:auto;display:flex;border:1px solid rgba(255,255,255,.5);border-radius:8px;overflow:hidden}
.lang button{background:none;border:0;color:#fff;padding:6px 10px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--yellow);color:#2a2000}
.notice{background:#fff6d6;color:#4a3a00;font-size:13px;padding:8px 16px;border-bottom:1px solid #ecd98a;flex:none}
@media (prefers-color-scheme:dark){.notice{background:#2c2610;color:#f3dc85;border-color:#4a3f14}}
#log{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.msg{max-width:86%;padding:10px 13px;border-radius:14px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.bot{align-self:flex-start;background:var(--bot);border:1px solid var(--line);border-bottom-left-radius:4px}
.user{align-self:flex-end;background:var(--user);color:var(--user-text);border-bottom-right-radius:4px}
.err{align-self:flex-start;background:transparent;border:1px solid var(--red);color:var(--red);border-radius:10px;font-size:14px}
.typing{display:inline-flex;gap:4px;align-items:center}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--green);opacity:.4;animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:8px 16px;background:var(--bg);flex:none}
.chips button{border:1px solid var(--green);background:var(--surface);color:var(--green);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
@media (prefers-color-scheme:dark){.chips button{color:#7fd6a4;border-color:#2f6b47}}
.chips button:hover{background:var(--green);color:#fff}
.composer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface);flex:none}
.composer input{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:999px;padding:11px 16px;font:inherit;font-size:15px;min-width:0}
.composer input:focus{outline:2px solid var(--yellow);border-color:var(--green)}
.composer button{border:0;background:var(--green);color:#fff;border-radius:999px;padding:0 20px;font:inherit;font-weight:700;cursor:pointer}
.composer button:disabled{opacity:.5;cursor:not-allowed}
.composer button:focus-visible,.chips button:focus-visible,.lang button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.typing i{animation:none;opacity:.7}}

/* ===== Optimisation mobile (doit rester en dernier) ===== */
@media (max-width:520px){
  header{padding:8px 12px;gap:10px;border-bottom-width:3px}
  .logo{height:38px;padding:4px 4px;border-radius:8px}
  header h1{font-size:16px}
  header p{font-size:11px}
  .lang button{padding:5px 9px;font-size:12px}
  .notice{font-size:11.5px;padding:5px 12px;line-height:1.3}
  #log{padding:10px 12px;gap:8px}
  .msg{font-size:14px;padding:8px 11px;max-width:90%}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding:6px 12px;gap:6px;-webkit-overflow-scrolling:touch}
  .chips button{flex:none;white-space:nowrap;font-size:12px;padding:6px 10px}
  .composer{padding:8px 12px calc(8px + env(safe-area-inset-bottom));gap:6px}
  .composer input{font-size:16px;padding:9px 14px}
  .composer button{padding:0 16px}
}
@media (max-height:640px){
  .notice{display:none}
}
/* ===== Logo plus visible, décalé à droite + champ de saisie remonté ===== */
:root{--lift:64px}
header{padding-left:22px}
.logo{height:62px;padding:5px 8px;margin-left:6px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.composer{padding-bottom:calc(12px + var(--lift) + env(safe-area-inset-bottom))}
@media (max-width:520px){
  header{padding-left:18px}
  .logo{height:50px;padding:4px 6px;margin-left:6px}
  .composer{padding-bottom:calc(8px + var(--lift) + env(safe-area-inset-bottom))}
}
.chips{scrollbar-width:none;-ms-overflow-style:none}
.chips::-webkit-scrollbar{display:none}
</style>
</head>
<body>
<div class="app">
  <header>
    <img class="logo" src="logo.jpeg" alt="NIC Sénégal" onerror="this.style.display='none'">
    <div>
      <h1>SAMA.SN</h1>
      <p id="subtitle"></p>
    </div>
    <div class="lang" role="group" aria-label="Langue / Language">
      <button id="btn-fr" aria-pressed="true">FR</button>
      <button id="btn-en" aria-pressed="false">EN</button>
    </div>
  </header>
  <div class="notice" id="notice"></div>
  <div id="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form class="composer" id="form" autocomplete="off">
    <input id="input" type="text" maxlength="500" required>
    <button id="send" type="submit"></button>
  </form>
</div>

<script>
const API_URL = "https://x8ki-letl-twmt.n7.xano.io/api:I57g9mOG/sama_chat";

const T = {
  fr: {
    subtitle: "Assistant du NIC Sénégal",
    notice: "Le NIC Sénégal gère le registre du .sn mais ne vend pas de noms de domaine : ce sont les Bureaux d'Enregistrement accrédités qui vendent.",
    hello: "Bonjour ! Je réponds à vos questions sur le .sn : charte de nommage, démarches, Bureaux d'Enregistrement, renouvellement. Que voulez-vous savoir ?",
    placeholder: "Posez votre question…",
    send: "Envoyer",
    error: "Le service ne répond pas pour le moment. Réessayez dans une minute ou écrivez à l'équipe technique via la messagerie.",
    chips: ["Qu'est-ce qu'un nom de domaine .sn ?", "Comment obtenir un nom en .sn ?", "Combien coûte un nom de domaine ?", "Comment devenir Bureau d'Enregistrement ?"]
  },
  en: {
    subtitle: "NIC Senegal assistant",
    notice: "NIC Senegal runs the .sn registry but does not sell domain names: accredited Registrars do.",
    hello: "Hello! I can answer your questions about .sn: naming charter, how to get a domain, Registrars, renewals. What would you like to know?",
    placeholder: "Ask your question…",
    send: "Send",
    error: "The service is not responding right now. Try again in a minute or contact the technical team through the messaging space.",
    chips: ["What is a .sn domain name?", "How do I get a .sn domain?", "How much does a domain cost?", "How do I become a Registrar?"]
  }
};

let lang = "fr";
let turns = [];
const $ = id => document.getElementById(id);
const log = $("log"), input = $("input"), send = $("send"), form = $("form");

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function fmt(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"$1");}

function add(cls, text, html){
  const d = document.createElement("div");
  d.className = "msg " + cls;
  if (html) d.innerHTML = text; else d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

function render(){
  const t = T[lang];
  document.documentElement.lang = lang;
  $("subtitle").textContent = t.subtitle;
  $("notice").textContent = t.notice;
  input.placeholder = t.placeholder;
  send.textContent = t.send;
  $("btn-fr").setAttribute("aria-pressed", lang==="fr");
  $("btn-en").setAttribute("aria-pressed", lang==="en");
  const chips = $("chips"); chips.innerHTML = "";
  t.chips.forEach(q => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = q;
    b.onclick = () => ask(q);
    chips.appendChild(b);
  });
}

function setLang(l){
  lang = l; render(); turns = [];
  log.innerHTML = ""; add("bot", T[lang].hello);
}

async function ask(text){
  text = text.trim().slice(0, 500);
  if (!text) return;
  add("user", text);
  input.value = ""; send.disabled = true;
  const wait = add("bot", '<span class="typing"><i></i><i></i><i></i></span>', true);
  const payload = JSON.stringify({
    message: text,
    lang,
    history: turns.slice(-6)
      .map(t => (t.r === "u" ? "Utilisateur : " : "Assistant : ") + t.c.slice(0, 600))
      .join("\n")
  });
  try {
    let data = null;
    for (let i = 0; i < 2 && !data; i++) {
      try {
        const r = await fetch(API_URL, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: payload
        });
        if (r.ok) {
          const d = await r.json();
          if (d.reply) data = d;
        } else {
          console.warn("HTTP " + r.status + " (essai " + (i + 1) + ")");
        }
      } catch (err) {
        console.warn("Reseau (essai " + (i + 1) + ")", err);
      }
      if (!data && i === 0) await new Promise(res => setTimeout(res, 2000));
    }
    if (!data) throw new Error("service indisponible");
    wait.innerHTML = fmt(data.reply);
    turns.push({r: "u", c: text}, {r: "a", c: data.reply});
  } catch (e) {
    wait.className = "msg err";
    wait.textContent = T[lang].error;
    console.error(e);
  } finally {
    send.disabled = false; input.focus();
    log.scrollTop = log.scrollHeight;
  }
}

form.addEventListener("submit", e => { e.preventDefault(); ask(input.value); });
$("btn-fr").onclick = () => setLang("fr");
$("btn-en").onclick = () => setLang("en");
setLang("fr");
</script>
</body>
</html>
